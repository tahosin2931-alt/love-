
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Birthday Surprise ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #02000b;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* GALAXY */

#universe {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
    background:
    radial-gradient(ellipse at 20% 20%, #481078, transparent 45%),
    radial-gradient(ellipse at 85% 75%, #151c80, transparent 45%),
    radial-gradient(ellipse at 50% 50%, #160529, #02000b 80%);
}

.nebula {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .4;
    animation: nebulaMove 15s infinite alternate;
}

.n1 {
    background: #a000ff;
    top: -200px;
    left: -150px;
}

.n2 {
    background: #0055ff;
    right: -200px;
    bottom: -200px;
}

.n3 {
    background: #e9008d;
    left: 40%;
    top: 40%;
}

@keyframes nebulaMove {
    to { transform: translate(100px,80px) scale(1.3); }
}

#stars {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .2; transform: scale(.7); }
    to { opacity: 1; transform: scale(1.8); }
}

.shooting {
    position: absolute;
    width: 100px;
    height: 2px;
    background: linear-gradient(90deg,white,transparent);
    animation: shoot 4s linear infinite;
    opacity: 0;
}

@keyframes shoot {
    0% { transform: translate(0,0) rotate(-35deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translate(-500px,400px) rotate(-35deg); opacity: 0; }
}

/* PASSWORD */

#passwordScreen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.passwordBox {
    width: 300px;
    height: 300px;
    border: 2px solid #d66aff;
    border-radius: 20px;
    background: rgba(20,0,40,.85);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 30px #a000ff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 18px;
    animation: boxGlow 2s infinite alternate;
}

@keyframes boxGlow {
    to { box-shadow: 0 0 55px #e000ff; }
}

.lock { font-size: 45px; }

.passwordBox h2 {
    color: #e7a4ff;
    text-shadow: 0 0 15px #c000ff;
}

.passwordBox input {
    width: 82%;
    padding: 13px;
    border: 1px solid #db83ff;
    border-radius: 9px;
    text-align: center;
    background: #100020;
    color: white;
    outline: none;
}

.passwordBox button {
    padding: 12px 35px;
    border: none;
    border-radius: 30px;
    color: white;
    background: linear-gradient(45deg,#7b00ff,#f000b9);
    box-shadow: 0 0 20px #c000ff;
    font-weight: bold;
    cursor: pointer;
}

#error {
    color: #ff8bb9;
    font-size: 13px;
}

/* MAIN */

#main {
    display: none;
    position: relative;
    width: 100%;
    height: 100vh;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
    perspective: 1200px;
}

/* MUSIC BUTTON */

#musicBtn {
    display: none;
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 200;
    border: 1px solid #ff8bdf;
    background: rgba(75,0,100,.8);
    color: white;
    padding: 12px 18px;
    border-radius: 30px;
    box-shadow: 0 0 15px #ff00bb;
    cursor: pointer;
}

/* HEART */

#heart {
    position: relative;
    width: 340px;
    height: 330px;
    flex-shrink: 0;
    animation: heartFloat 4s ease-in-out infinite;
}

@keyframes heartFloat {
    50% { transform: translateY(-10px) rotateY(5deg); }
}

.petal {
    position: absolute;
    left: 50%;
    top: 50%;
    font-size: 22px;
    opacity: 0;
    filter: drop-shadow(0 0 7px #ff164f);
    animation: bloom 1s ease forwards;
}

@keyframes bloom {
    from {
        opacity: 0;
        transform: translate(-50%,-50%) scale(0) rotate(-180deg);
    }
    to {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1) rotate(0);
    }
}

#loveText {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    font-size: 55px;
    letter-spacing: 5px;
    font-weight: 900;
    color: #ff315f;
    text-shadow: 2px 2px #950027,
                 5px 5px #510015,
                 0 0 20px red,
                 0 0 40px #ff1744;
    z-index: 5;
    animation: loveBeat 1s infinite;
    transition: opacity 1.5s;
}

@keyframes loveBeat {
    50% { scale: 1.13; }
}

/* PHOTO */

#photo {
    display: none;
    position: absolute;
    width: 145px;
    height: 145px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #ffb0d7;
    box-shadow: 0 0 25px #ff00c8, 0 0 55px #ff0088;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    z-index: 10;
    animation: photoIn 2s ease forwards;
}

@keyframes photoIn {
    from {
        opacity: 0;
        transform: translate(-50%,-50%) scale(0) rotate(-180deg);
    }
    to {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1) rotate(0);
    }
}

/* BIRTHDAY */

#birthday {
    display: none;
    text-align: center;
    font-size: clamp(28px,7vw,55px);
    font-weight: 900;
    margin-top: 5px;
    color: #ff9ce5;
    text-shadow: 0 0 10px #ff00b7,
                 0 0 30px #9e00ff,
                 0 0 60px #ff00b7;
    z-index: 20;
    animation: birthdayIn 2s ease;
}

@keyframes birthdayIn {
    from {
        opacity: 0;
        transform: scale(0) translateY(40px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

/* CAKE */

#cake {
    display: none;
    position: relative;
    width: 300px;
    height: 250px;
    margin-top: 10px;
    flex-shrink: 0;
    animation: cakeIn 2s ease;
    filter: drop-shadow(0 0 20px #ff00a6);
}

@keyframes cakeIn {
    from {
        opacity: 0;
        transform: translateY(150px) scale(.3);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.layer {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 15px 15px 28px 28px;
    box-shadow: inset -12px -10px 15px #68002c,
                inset 8px 6px 12px #ffc5e1,
                0 12px 15px #000;
}

.bottom {
    width: 255px;
    height: 65px;
    bottom: 12px;
    background: linear-gradient(135deg,#ffb0d1,#e50078,#700050);
}

.middle {
    width: 205px;
    height: 55px;
    bottom: 72px;
    background: linear-gradient(135deg,#fff0fa,#ff4ca8,#a50079);
}

.top {
    width: 155px;
    height: 48px;
    bottom: 124px;
    background: linear-gradient(135deg,#fff,#ff91d4,#d9009d);
}

.cakeTop {
    position: absolute;
    left: 50%;
    bottom: 158px;
    transform: translateX(-50%);
    width: 160px;
    height: 25px;
    border-radius: 50%;
    background: #ffc5ed;
    box-shadow: 0 0 20px #ff8de2;
}

/* NUMBER 20 CANDLES */

#candles {
    position: absolute;
    width: 260px;
    height: 150px;
    left: 50%;
    bottom: 158px;
    transform: translateX(-50%);
    z-index: 15;
}

#candles svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 0 8px hotpink);
}

.flame {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: flame .4s infinite alternate;
}

@keyframes flame {
    from { transform: scale(.85) rotate(-5deg); }
    to { transform: scale(1.15) rotate(5deg); }
}

.cakeText {
    position: absolute;
    bottom: 33px;
    width: 100%;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    color: white;
    z-index: 5;
    text-shadow: 0 0 10px pink;
}

@media(max-width:450px) {
    #heart { transform: scale(.78); }
    #cake { transform: scale(.82); }
    #birthday { font-size: 28px; }
}
</style>
</head>

<body>

<div id="universe">
    <div class="nebula n1"></div>
    <div class="nebula n2"></div>
    <div class="nebula n3"></div>
    <div id="stars"></div>
    <div id="shootingStars"></div>
</div>

<!-- PASSWORD -->

<div id="passwordScreen">
    <div class="passwordBox">
        <div class="lock">🔐</div>
        <h2>Secret Birthday</h2>
        <p>Enter Your Password ❤️</p>
        <input type="password" id="pass" placeholder="Enter Password">
        <button onclick="startSurprise()">OPEN ❤️</button>
        <p id="error"></p>
    </div>
</div>

<button id="musicBtn" onclick="toggleMusic()">
    🔊 Music ON
</button>

<!-- SURPRISE -->

<div id="main">

    <div id="heart">
        <div id="petals"></div>
        <div id="loveText">LOVE</div>

        <!-- YOUR PHOTO -->
        <img id="photo"
        src="https://uploads.onecompiler.io/4595u6ddx/1794647308615/Mafia%20Girl.jpeg"
        alt="Birthday Photo">
    </div>

    <h1 id="birthday">HAPPY BIRTHDAY ❤️</h1>

    <!-- CAKE -->

    <div id="cake">

        <div class="cakeTop"></div>

        <!-- 20 CANDLES -->

        <div id="candles">
            <svg viewBox="0 0 260 150">

                <defs>
                    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="45%" stop-color="#ff8fc5"/>
                        <stop offset="100%" stop-color="#c40063"/>
                    </linearGradient>
                </defs>

                <!-- 2 -->

                <path d="M20 35 C20 8 55 5 78 12 C115 23 119 55 95 78 C75 97 45 109 18 125 L120 125"
                fill="none" stroke="#790039" stroke-width="27"
                stroke-linecap="round" stroke-linejoin="round"/>

                <path d="M20 35 C20 8 55 5 78 12 C115 23 119 55 95 78 C75 97 45 109 18 125 L120 125"
                fill="none" stroke="url(#wax)" stroke-width="19"
                stroke-linecap="round" stroke-linejoin="round"/>

                <!-- 0 -->

                <ellipse cx="195" cy="70" rx="40" ry="55"
                fill="none" stroke="#790039" stroke-width="27"/>

                <ellipse cx="195" cy="70" rx="40" ry="55"
                fill="none" stroke="url(#wax)" stroke-width="19"/>

                <!-- FLAMES -->

                <path class="flame"
                d="M20 8 Q-5 -15 20 -43 Q45 -15 20 8"
                fill="#ff8c00"/>

                <path class="flame"
                d="M20 0 Q8 -16 20 -31 Q32 -16 20 0"
                fill="#fff28a"/>

                <path class="flame"
                d="M195 10 Q170 -15 195 -43 Q220 -15 195 10"
                fill="#ff8c00"/>

                <path class="flame"
                d="M195 0 Q183 -16 195 -31 Q207 -16 195 0"
                fill="#fff28a"/>

            </svg>
        </div>

        <div class="layer top"></div>
        <div class="layer middle"></div>
        <div class="layer bottom"></div>

        <div class="cakeText">HAPPY BIRTHDAY ❤️</div>
    </div>

</div>

<script>

/* STARS */

const stars = document.getElementById("stars");

for(let i=0; i<200; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random()*100+"vw";
    star.style.top = Math.random()*100+"vh";
    star.style.animationDelay = Math.random()*3+"s";
    stars.appendChild(star);
}

/* SHOOTING STARS */

const shooting = document.getElementById("shootingStars");

for(let i=0; i<5; i++) {
    const s = document.createElement("div");
    s.className = "shooting";
    s.style.top = Math.random()*70+"vh";
    s.style.left = (40+Math.random()*70)+"vw";
    s.style.animationDelay = i*2+"s";
    shooting.appendChild(s);
}

/* BIRTHDAY MUSIC - ORIGINAL INSTRUMENTAL */

let audioContext = null;
let musicPlaying = false;
let musicTimer = null;
let noteIndex = 0;

const melody = [
    [523.25, 0.35],
    [523.25, 0.35],
    [587.33, 0.7],
    [523.25, 0.7],
    [698.46, 0.7],
    [659.25, 1.2],
    [523.25, 0.35],
    [523.25, 0.35],
    [587.33, 0.7],
    [523.25, 0.7],
    [783.99, 0.7],
    [698.46, 1.2],
    [523.25, 0.35],
    [523.25, 0.35],
    [1046.5, 0.7],
    [880, 0.7],
    [698.46, 0.7],
    [659.25, 0.7],
    [587.33, 1.2]
];

function playNote() {

    if(!musicPlaying || !audioContext) return;

    const [frequency, duration] = melody[noteIndex];

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(0, audioContext.currentTime);
    gain.gain.linearRampToValueAtTime(0.13, audioContext.currentTime + 0.04);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration + 0.05);

    noteIndex = (noteIndex + 1) % melody.length;

    musicTimer = setTimeout(playNote, duration * 850);
}

async function startMusic() {

    if(!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    await audioContext.resume();

    if(musicPlaying) return;

    musicPlaying = true;
    noteIndex = 0;

    document.getElementById("musicBtn").innerText = "🔊 Music ON";

    playNote();
}

function stopMusic() {

    musicPlaying = false;
    clearTimeout(musicTimer);

    document.getElementById("musicBtn").innerText = "🔇 Music OFF";
}

function toggleMusic() {

    if(musicPlaying) {
        stopMusic();
    } else {
        startMusic();
    }
}

/* PASSWORD */

function startSurprise() {

    const password = document.getElementById("pass").value;

    if(password !== "11-14-2026") {
        document.getElementById("error").innerText =
        "Wrong Password! Try Again ❤️";
        return;
    }

    document.getElementById("passwordScreen").style.display = "none";
    document.getElementById("main").style.display = "flex";
    document.getElementById("musicBtn").style.display = "block";

    startMusic();

    createHeart();
}

/* ROSE HEART */

function createHeart() {

    const container = document.getElementById("petals");
    const total = 130;

    for(let i=0; i<total; i++) {

        const t = Math.PI*2*i/total;

        const x = 16*Math.pow(Math.sin(t),3);

        const y = 13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);

        const petal = document.createElement("span");

        petal.className = "petal";
        petal.innerHTML = ["🌹","🌺","🌸"][i%3];

        petal.style.left = `calc(50% + ${x*7.5}px)`;
        petal.style.top = `calc(50% - ${y*7.5}px)`;
        petal.style.zIndex = Math.floor(Math.random()*8);
        petal.style.animationDelay = (i*25)+"ms";

        container.appendChild(petal);
    }

    const formationTime = total*25+1000;

    /* PHOTO AFTER 5 SECONDS */

    setTimeout(() => {
        document.getElementById("loveText").style.opacity = "0";
        document.getElementById("photo").style.display = "block";
    }, formationTime+5000);

    /* BIRTHDAY AFTER 5 SECONDS */

    setTimeout(() => {
        document.getElementById("birthday").style.display = "block";
    }, formationTime+10000);

    /* CAKE */

    setTimeout(() => {
        document.getElementById("cake").style.display = "block";
    }, formationTime+13000);
}

/* ENTER KEY */

document.getElementById("pass").addEventListener("keydown", function(e) {
    if(e.key === "Enter") {
        startSurprise();
    }
});

</script>

</body>
</html>
